<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Concurseiro</title>
    <link rel="stylesheet" href="cadastro.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Primeiro precisa cadastrar seu acesso único</h1>
            <div class="input-box">
                <input type="text" maxlength="14" class="cpf" placeholder="Insira seu CPF" required>
                <i class='bxr bx-user-id-card'></i>
            </div>
            
            <div class="input-box">
                <input type="password" maxlength="6" placeholder="Coloque sua senha" required>
                <i class='bx bx-lock'></i>
            </div>
            <div class="checkboxes">
                <ul class="list-group">
                    <li class="list-group-item">
                        <a href="./Conteudo_Colegio_Militar.html" style="color: blue; text-decoration: none;">Colégio Tiradentes</a>
                    </li>
                    <li class="list-group-item">
                        <a href="./Conteudo_IFAL.html" style="color: blue; text-decoration: none;">IFAL</a>
                    </li>
                    <li class="list-group-item">
                        <a href="./Conteudo_ENEM.html" style="color: blue; text-decoration: none;">ENEM</a>
                    </li>
                </ul>
            </div>

        </form>
        

    </div>
    <script>
      // ----------------------------
        // MÁSCARA DE CPF (somente números)
        // ----------------------------
        let campoCpf = document.querySelector('.cpf');

        campoCpf.addEventListener("input", (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '').substring(0, 11);
            let formatted = "";

            if (value.length > 0) {
                formatted = value.substring(0, 3);
            }
            if (value.length >= 4) {
                formatted += "." + value.substring(3, 6);
            }
            if (value.length >= 7) {
                formatted += "." + value.substring(6, 9);
            }
            if (value.length >= 10) {
                formatted += "-" + value.substring(9, 11);
            }

            e.target.value = formatted;
        });
    </script>
</body>

</html>
