<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Concurseiro</title>
    <link rel="stylesheet" href="home.css">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
 <div class="wrapper">
        <form action="">
            <h1>A partir de hoje sua vida vai mudar.</h1>

            <div class="input-box">
                <input type="text" placeholder="Nome Completo" required>
                <i class='bx bx-user'></i>
            </div>

            <div class="input-box">
                <input type="email" placeholder="E-mail" required>
                <i class='bx bx-envelope'></i>
            </div>

            <div class="input-box">
                <input type="tel" maxlength="15" inputmode="numeric" placeholder="(99) 99999-9999" required>
                <i class='bx bx-phone'></i>
            </div>

            <div class="input-box">
                <input type="text" maxlength="14" class="cpf" inputmode="numeric" placeholder="Insira seu CPF" required>
                <i class='bx bx-id-card'></i>
            </div>
            
            <div class="input-box">
                <input type="password" maxlength="6" placeholder="Coloque sua senha" required>
                <i class='bx bx-lock'></i>
            </div>

            <a href="./cadastro.html"><button type="button" class="btn1">Salvar dados</button></a>
            
            <a href="./cadastro.html"><button type="button" class="btn2">Já tenho cadastro</button></a>

        </form>
    </div>

    <script>
        // ----------------------------
        // MÁSCARA DE TELEFONE
        // ----------------------------
        let campoTelefone = document.querySelector('.input-box input[type="tel"]');
        
        campoTelefone.addEventListener("input", (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '').substring(0, 11);
            let formattedValue = '';

            for (let i = 0; i < value.length; i++) {
                if (i === 0) {
                    formattedValue += '(';
                } else if (i === 2) {
                    formattedValue += ') ';
                } else if (i === 7 && value.length > 10) {
                    formattedValue += '-';
                } else if (i === 6 && value.length <= 10) {
                     formattedValue += '-';
                }
                formattedValue += value[i];
            }
            
            e.target.value = formattedValue;
        });


        // ----------------------------
        // MÁSCARA DE CPF (somente números)
        // ----------------------------
        let campoCpf = document.querySelector('.cpf');

        campoCpf.addEventListener("input", (e) => {
            let value = e.target.value.replace(/[^0-9]/g, '').substring(0, 11);
            let formatted = "";

            if (value.length > 0) {
                formatted = value.substring(0, 3);
            }
            if (value.length >= 4) {
                formatted += "." + value.substring(3, 6);
            }
            if (value.length >= 7) {
                formatted += "." + value.substring(6, 9);
            }
            if (value.length >= 10) {
                formatted += "-" + value.substring(9, 11);
            }

            e.target.value = formatted;
        });
    </script>

</body>

</html>
